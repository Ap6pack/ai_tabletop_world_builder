# Optional Prometheus + Grafana stack. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up
# Both UIs are bound to the host's loopback interface; reach them through an
# SSH tunnel or a reverse proxy that adds authentication. Set
# GRAFANA_ADMIN_PASSWORD in .env first.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
