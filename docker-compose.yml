# Production-leaning defaults: authentication is on, secrets are required, and
# only the API (8000) and UI (8501) are published. Postgres and Redis stay on
# the internal compose network; docker-compose.dev.yml publishes them for local
# debugging. Set POSTGRES_PASSWORD, REDIS_PASSWORD and JWT_SECRET_KEY in .env
# (see .env.example) — `docker compose up` refuses to start without them.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Use the bundled Postgres and Redis services by default. These override
      # any DATABASE_URL/REDIS_URL from .env so the stack is Postgres-backed
      # out of the box.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wargame}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-wargame}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      REQUIRE_AUTH: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    volumes:
      - ./data:/app/data
      - ./scenarios:/app/scenarios
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      API_HOST: api
      API_PORT: "8000"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wargame}
      POSTGRES_USER: ${POSTGRES_USER:-wargame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wargame} -d ${POSTGRES_DB:-wargame}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
