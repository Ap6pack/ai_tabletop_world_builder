global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    # If METRICS_TOKEN is set on the API, uncomment and mount the token file:
    # authorization:
    #   credentials_file: /etc/prometheus/metrics_token
