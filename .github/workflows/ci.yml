name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # ruff is pinned in requirements-dev.txt so local and CI formatting agree.
      - run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with requires-python in pyproject.toml.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest --tb=short -q
      - name: Migrations match the models
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: alembic upgrade head && alembic check

  test-postgres:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wargame
          POSTGRES_PASSWORD: wargame
          POSTGRES_DB: wargame_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wargame -d wargame_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run the suite against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://wargame:wargame@localhost:5432/wargame_test
        run: python -m pytest --tb=short -q
      - name: Migrations match the models on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://wargame:wargame@localhost:5432/wargame_test
        run: alembic upgrade head && alembic check

  build:
    runs-on: ubuntu-latest
    needs: [test, test-postgres]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ai-tabletop-world-builder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: ai-tabletop-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
